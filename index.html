<!doctype html>
<html lang="ko"><head>
  

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여정 — AI 맞춤 여행 플래너</title>
  <meta name="description" content="사용자의 여행 취향과 조건을 분석해 맞춤 여행지 3곳을 추천하고, 날짜별 세부 코스와 효율적인 이동 경로, 네이버 블로그 후기 탐색까지 제공하는 여행 플래너">
  <meta property="og:title" content="여정 — AI 맞춤 여행 플래너">
  <meta property="og:description" content="취향 기반 맞춤 여행지 추천부터 시간대별 코스, 동선 최적화, 후기 검색까지 한 번에 설계하세요.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --border-hairline: #e2e8f0;
      --border-strong: #cbd5e1;
      --ink-primary: #0f172a;
      --ink-secondary: #475569;
      --ink-muted: #64748b;
      --accent-blue: #1d4ed8;
      --accent-blue-hover: #1e40af;
      --accent-blue-soft: #eff6ff;
      --accent-green: #047857;
      --accent-green-soft: #ecfdf5;
      --accent-amber: #b45309;
      --accent-amber-soft: #fffbeb;
      --accent-red: #b91c1c;
      --accent-red-soft: #fef2f2;
      --font-sans: "IBM Plex Sans KR", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      --radius-lg: 12px;
      --radius-md: 8px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      font-family: var(--font-sans);
    }

    body {
      margin: 0;
      background: var(--bg-canvas);
      color: var(--ink-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3, h4, p {
      margin: 0;
    }

    h1, h2, h3 {
      text-wrap: balance;
    }

    button, input, textarea, select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
      font-family: var(--font-mono);
    }

    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Top Bar Contract: 3 zones */
    .topbar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-hairline);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      padding: 14px 24px;
      max-width: 1240px;
      margin: 0 auto;
    }

    .brand {
      background: none;
      border: none;
      padding: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink-primary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .topnav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-link {
      background: none;
      border: none;
      padding: 4px 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-secondary);
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.15s ease;
    }

    .nav-link:hover:not(:disabled) {
      color: var(--ink-primary);
    }

    .nav-link.active {
      color: var(--ink-primary);
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    .nav-link:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn-outline-sm {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-primary);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn-outline-sm:hover {
      background: var(--bg-subtle);
      border-color: var(--ink-primary);
    }

    .btn-primary-sm {
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      background: var(--ink-primary);
      border: none;
      border-radius: var(--radius-md);
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }

    .btn-primary-sm:hover {
      background: var(--accent-blue);
    }

    @media (max-width: 760px) {
      .topnav {
        display: none;
      }
      .topbar-inner {
        padding: 12px 16px;
        gap: 12px;
      }
      .container {
        padding: 0 16px;
      }
    }

    @media (max-width: 520px) {
      .topbar-actions {
        gap: 6px;
      }
      .btn-outline-sm, .btn-primary-sm {
        padding: 7px 10px;
        font-size: 11px;
      }
    }

    /* Hero */
    .hero {
      position: relative;
      background: #0f172a;
      color: #ffffff;
      overflow: hidden;
      border-bottom: 1px solid var(--border-hairline);
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.92;
    }

    .hero-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.25) 0%, rgba(15, 23, 42, 0.72) 65%, rgba(15, 23, 42, 0.9) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 1240px;
      margin: 0 auto;
      padding: 68px 24px 44px;
    }

    .hero-kicker {
      font-size: 12px;
      font-weight: 500;
      color: #bfdbfe;
      margin-bottom: 8px;
    }

    .hero-title {
      font-size: clamp(1.75rem, 3.4vw, 2.85rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.22;
      max-width: 680px;
    }

    .hero-sub {
      font-size: 15px;
      color: #e2e8f0;
      max-width: 560px;
      margin-top: 12px;
      line-height: 1.65;
    }

    /* Main Workspace */
    main.container {
      flex: 1;
      padding-top: 28px;
      padding-bottom: 48px;
    }

    .step-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      font-size: 12px;
      color: var(--ink-muted);
      padding-bottom: 14px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .step-btn {
      background: none;
      border: none;
      padding: 0;
      font-size: 12px;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .step-btn.active {
      color: var(--accent-blue);
      font-weight: 600;
    }

    .step-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Cards & Forms */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 28px;
    }

    @media (max-width: 640px) {
      .card {
        padding: 20px;
      }
    }

    .stack-lg {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--ink-primary);
    }

    .section-desc {
      font-size: 13px;
      color: var(--ink-muted);
      margin-top: 4px;
    }

    .count-note {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-blue);
    }

    /* Interactive Chips / Buttons */
    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      background: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .chip-btn:hover {
      background: var(--bg-subtle);
      color: var(--ink-primary);
    }

    .chip-btn.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #ffffff;
    }

    .chip-btn-dark.active {
      background: var(--ink-primary);
      border-color: var(--ink-primary);
      color: #ffffff;
    }

    .chip-sm {
      padding: 6px 12px;
      font-size: 12px;
    }

    .custom-style-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
      max-width: 460px;
    }

    .input-text, .input-textarea, .input-number, .input-time {
      padding: 10px 14px;
      font-size: 14px;
      color: var(--ink-primary);
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      transition: border-color 0.15s ease;
    }

    .input-text:focus, .input-textarea:focus, .input-number:focus, .input-time:focus {
      outline: none;
      border-color: var(--accent-blue);
    }

    .input-text {
      flex: 1;
      min-width: 200px;
    }

    .input-textarea {
      width: 100%;
      resize: vertical;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-primary);
      background: var(--bg-subtle);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 28px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background: var(--accent-blue);
      border: none;
      border-radius: var(--radius-md);
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }

    .btn-cta:hover {
      background: var(--accent-blue-hover);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
    }

    @media (max-width: 900px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .segmented {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      background: var(--bg-subtle);
      border-radius: var(--radius-md);
    }

    .segmented-full {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      width: 100%;
    }

    .seg-btn {
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-secondary);
      background: transparent;
      border: none;
      border-radius: 6px;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .seg-btn.active {
      background: var(--bg-surface);
      color: var(--ink-primary);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-primary);
      margin-bottom: 8px;
    }

    /* Budget Range */
    .budget-box {
      padding-top: 20px;
      border-top: 1px solid var(--bg-subtle);
    }

    .budget-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .budget-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .budget-input-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-number {
      width: 92px;
      padding: 7px 10px;
      text-align: right;
      font-weight: 600;
      font-family: var(--font-mono);
    }

    .range-slider {
      width: 100%;
      accent-color: var(--accent-blue);
      cursor: pointer;
    }

    .tick-track {
      position: relative;
      height: 22px;
      margin-top: 4px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--ink-muted);
    }

    .tick-btn {
      position: absolute;
      background: none;
      border: none;
      padding: 0;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .tick-btn:hover {
      color: var(--ink-primary);
    }

    /* Pace Cards */
    .pace-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 720px) {
      .pace-grid {
        grid-template-columns: 1fr;
      }
    }

    .pace-card {
      text-align: left;
      padding: 16px;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      background: var(--bg-canvas);
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .pace-card.active {
      background: var(--accent-blue-soft);
      border-color: var(--accent-blue);
    }

    .pace-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-primary);
    }

    .pace-desc {
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 4px;
    }

    .form-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 8px;
    }

    .alert-error {
      padding: 12px 16px;
      font-size: 13px;
      color: var(--accent-red);
      background: var(--accent-red-soft);
      border: 1px solid #fecaca;
      border-radius: var(--radius-md);
    }

    /* Destination Cards (Step 2) */
    .rec-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .rec-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      align-items: stretch;
    }

    @media (max-width: 1024px) {
      .rec-grid {
        grid-template-columns: 1fr;
      }
    }

    .dest-card {
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.15s ease;
    }

    .dest-card:hover {
      border-color: var(--border-strong);
    }

    .dest-media {
      position: relative;
      aspect-ratio: 4 / 3;
      width: 100%;
      background: #1e293b;
      overflow: hidden;
    }

    .dest-media img, .dest-media svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .dest-media-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 30%, rgba(15, 23, 42, 0.82) 100%);
    }

    .dest-media-caption {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 16px;
      color: #ffffff;
    }

    .dest-region {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 500;
    }

    .dest-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 2px;
    }

    .dest-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 22px;
    }

    .meta-inline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--ink-muted);
      margin-bottom: 10px;
    }

    .meta-inline strong {
      color: var(--ink-primary);
    }

    .dest-tagline {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink-primary);
      margin-bottom: 10px;
      line-height: 1.45;
    }

    .dest-reason {
      font-size: 13px;
      color: var(--ink-secondary);
      line-height: 1.65;
      margin-bottom: 16px;
    }

    .cost-grid {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--bg-subtle);
      margin-bottom: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 16px;
      font-size: 12px;
    }

    .cost-row {
      display: flex;
      justify-content: space-between;
      color: var(--ink-secondary);
    }

    .btn-select-dest {
      width: 100%;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background: var(--ink-primary);
      border: none;
      border-radius: var(--radius-md);
      transition: background 0.15s ease;
    }

    .btn-select-dest:hover {
      background: var(--accent-blue);
    }

    /* Step 3: Itinerary Workspace */
    .workspace-top {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .rebalance-bar {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--bg-subtle);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .rebalance-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 20px;
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      background: var(--bg-canvas);
    }

    .stepper-btn {
      padding: 6px 12px;
      background: none;
      border: none;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink-primary);
    }

    .stepper-btn:hover:not(:disabled) {
      background: var(--border-hairline);
    }

    .stepper-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .stepper-val {
      padding: 0 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-mono);
      white-space: nowrap;
    }

    .tabs-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .workspace-split {
      display: grid;
      grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
      gap: 28px;
      align-items: start;
    }

    @media (max-width: 1080px) {
      .workspace-split {
        grid-template-columns: 1fr;
      }
    }

    .sticky-col {
      position: sticky;
      top: 76px;
    }

    @media (max-width: 1080px) {
      .sticky-col {
        position: static;
      }
    }

    .day-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
    }

    .transit-connector {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 16px;
      font-size: 12px;
      color: var(--ink-muted);
    }

    .transit-line {
      width: 1px;
      height: 16px;
      background: var(--border-strong);
      margin-left: 10px;
    }

    .stop-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .stop-card.selected {
      border-color: var(--accent-blue);
      background: #f8fbff;
    }

    .stop-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      function esc(str) {
        return String(str == null ? "" : str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatKrw(won) {
        if (!Number.isFinite(won) || won <= 0) return "무료";
        if (won >= 10000) {
          const man = Math.floor(won / 10000);
          const rem = won % 10000;
          if (rem === 0) return man.toLocaleString("ko-KR") + "만원";
          return won.toLocaleString("ko-KR") + "원";
        }
        return won.toLocaleString("ko-KR") + "원";
      }

      function haversineKm(lat1, lng1, lat2, lng2) {
        if (!lat1 && !lng1) return 0;
        if (!lat2 && !lng2) return 0;
        const toRad = (d) => (d * Math.PI) / 180;
        const R = 6371;
        const dLat = toRad(lat2 - lat1);
        const dLng = toRad(lng2 - lng1);
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
        return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 10) / 10;
      }

      function estimateTransit(from, to, transportPref) {
        const km = haversineKm(from.lat, from.lng, to.lat, to.lng);
        if (km <= 0.8) {
          const mins = Math.max(4, Math.round(km * 14));
          return { mode: "도보", minutes: mins, distanceKm: km, summary: "도보 약 " + mins + "분 (" + km.toFixed(1) + "km)" };
        }
        const isCar = transportPref.includes("렌터카") || transportPref.includes("자차") || transportPref.includes("택시");
        if (isCar) {
          const mins = Math.max(6, Math.round((km / 28) * 60 + 4));
          const mode = transportPref.includes("택시") ? "택시" : "차량";
          return { mode, minutes: mins, distanceKm: km, summary: mode + " 약 " + mins + "분 (" + km.toFixed(1) + "km)" };
        }
        const mins = Math.max(8, Math.round((km / 18) * 60 + 6));
        const mode = km > 4 ? "지하철·버스" : "버스·도보";
        return { mode, minutes: mins, distanceKm: km, summary: mode + " 약 " + mins + "분 (" + km.toFixed(1) + "km)" };
      }

      function recalcTransits(stops) {
        return stops.map((s, idx) => {
          if (idx === 0) return Object.assign({}, s, { transitFromPrev: null });
          return Object.assign({}, s, { transitFromPrev: estimateTransit(stops[idx - 1], s, state.prefs.transport) });
        });
      }

      function totalDistanceKm(stops) {
        let sum = 0;
        for (let i = 1; i < stops.length; i++) {
          sum += haversineKm(stops[i - 1].lat, stops[i - 1].lng, stops[i].lat, stops[i].lng);
        }
        return Math.round(sum * 10) / 10;
      }

      function hydrateWikiPhoto(imgEl, wikiQuery) {
        if (!wikiQuery || typeof fetch !== "function") return;
        const url = "https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(wikiQuery);
        fetch(url)
          .then((r) => (r.ok ? r.json() : null))
          .then((data) => {
            if (!data) return;
            const src = (data.thumbnail && data.thumbnail.source) || (data.originalimage && data.originalimage.source);
            if (src && imgEl && imgEl.isConnected) {
              const highRes = src.replace(/\/\d+px-/, "/800px-");
              const tester = new Image();
              tester.referrerPolicy = "no-referrer";
              tester.onload = () => {
                if (imgEl.isConnected) imgEl.src = highRes;
              };
              tester.src = highRes;
            }
          })
          .catch(() => {});
      }

        const scored = pool.map((d) => {

          prefs.styles.forEach((st) => {

            ) {
              score += 14;
              matchedStyles.push(st);

          });

          if (d.nearbyCities.includes(prefs.departureCity)) score += 10;
          if (prefs.scope === "any" && d.scope === "domestic" && budgetWon <= 550000) score += 14;
          if (prefs.scope === "any" && d.scope === "international" && budgetWon >= 900000) score += 14;

          // Budget fitness
          const ratio = d.baseCost / Math.max(100000, budgetWon);
          if (ratio <= 1.2) score += 18;
          else if (ratio <= 1.55) score += 6;
          else score -= 18;

          // Companion fit
          if (prefs.companion.includes("부모님") && (d.styles.includes("역사") || d.styles.includes("힐링"))) score += 10;
          if (prefs.companion.includes("연인") && (d.styles.includes("야경") || d.styles.includes("감성 카페"))) score += 8;
          if (prefs.companion.includes("친구") && (d.styles.includes("맛집") || d.styles.includes("쇼핑"))) score += 8;
          if (prefs.companion.includes("혼자") && (d.styles.includes("감성 카페") || d.styles.includes("문화·예술"))) score += 8;

          const recDays = prefs.preferredDays || d.defaultDays;
          const recNights = Math.max(0, recDays - 1);

          // Scale displayed estimate realistically near user's budget & duration
          const durationFactor = recDays / d.defaultDays;
          const rawEstimate = Math.round((d.baseCost * durationFactor * 0.45 + budgetWon * 0.55) / 10000) * 10000;
          const estTotal = Math.max(100000, rawEstimate);

          const transportRatio = d.scope === "international" ? 0.36 : 0.18;
          const accomRatio = recNights > 0 ? 0.34 : 0;
          const foodRatio = 0.28;
          const transport = Math.round((estTotal * transportRatio) / 10000) * 10000;
          const accommodation = Math.round((estTotal * accomRatio) / 10000) * 10000;
          const food = Math.round((estTotal * foodRatio) / 10000) * 10000;
          const activities = Math.max(0, estTotal - transport - accommodation - food);

          const styleText = matchedStyles.length > 0 ? matchedStyles.join("·") : d.styles.slice(0, 3).join("·");
          const reason = `${prefs.departureCity}에서 ${prefs.transport}으로 이동하기 좋으며, 선택하신 '${styleText}' 취향에 최적화된 동선을 갖추고 있습니다. ${prefs.companion} 여행 템포(${prefs.pace === "relaxed" ? "여유롭게" : prefs.pace === "packed" ? "알차게" : "보통"})에 맞춰 핵심 명소와 검증된 로컬 맛집, 감성 공간을 균형 있게 즐길 수 있습니다.`;

          return {
            dest: d,
            score,
            recDays,
            recNights,
            estTotal,
            costBreakdown: { transport, accommodation, food, activities },
            reason
          };
        });

        scored.sort((a, b) => b.score - a.score);
        // Ensure at least 3 recommendations
        const top3 = scored.slice(0, 3);
        const scopeDesc = prefs.scope === "domestic" ? "국내" : prefs.scope === "international" ? "해외" : "국내·해외";
        const summary = `${prefs.departureCity} 출발 · ${prefs.companion} · 예산 ${prefs.budgetKrw.toLocaleString("ko-KR")}만원(${prefs.budgetBasis === "total" ? "일행 전체" : "1인 기준"}) 조건과 '${prefs.styles.slice(0, 4).join(", ")}' 취향을 분석해 가장 만족도가 높은 ${scopeDesc} 여행지 3곳을 선별했습니다.`;
        return { summary, items: top3 };
      }

      // Calibrate itinerary stop costs so sum equals targetBudgetWon EXACTLY
      function calibrateBudget(days, targetBudgetWon) {
        const allStops = [];
        days.forEach((d) => d.stops.forEach((s) => allStops.push(s)));
        if (allStops.length === 0 || targetBudgetWon <= 0) return days;

        const weights = { accommodation: 4, activity: 2, restaurant: 2, attraction: 1, cafe: 1 };
        let paid = allStops.filter((s) => s.estimatedCostKrw > 0);
        if (paid.length === 0) {
          allStops.forEach((s) => { s.estimatedCostKrw = (weights[s.category] || 1) * 10000; });
          paid = allStops;
        }
        const sum = paid.reduce((acc, s) => acc + s.estimatedCostKrw, 0);
        const stepUnit = targetBudgetWon < paid.length * 1000 ? 100 : 1000;
        let scaledSum = 0;
        paid.forEach((s) => {
          const rounded = Math.max(0, Math.round(((s.estimatedCostKrw / sum) * targetBudgetWon) / stepUnit) * stepUnit);
          s.estimatedCostKrw = rounded;
          scaledSum += rounded;
        });

        let diff = targetBudgetWon - scaledSum;
        if (diff > 0) {
          let anchor = paid[0];
          paid.forEach((s) => { if (s.estimatedCostKrw > anchor.estimatedCostKrw) anchor = s; });
          anchor.estimatedCostKrw += diff;
        } else if (diff < 0) {
          const sortedDesc = paid.slice().sort((a, b) => b.estimatedCostKrw - a.estimatedCostKrw);
          for (let i = 0; i < sortedDesc.length && diff < 0; i++) {
            const take = Math.min(sortedDesc[i].estimatedCostKrw, -diff);
            sortedDesc[i].estimatedCostKrw -= take;
            diff += take;
          }
        }
        return days;
      }

      function buildItinerary(destObj, daysCount, budgetMan, preservedUserStops) {
        const targetBudgetWon = budgetMan * 10000;
        const pool = destObj.stopsPool;
        const paceCount = state.prefs.pace === "relaxed" ? 3 : state.prefs.pace === "packed" ? 5 : 4;

        const attractions = pool.filter((s) => s.category === "attraction" || s.category === "activity");
        const restaurants = pool.filter((s) => s.category === "restaurant");
        const cafes = pool.filter((s) => s.category === "cafe");
        const accoms = pool.filter((s) => s.category === "accommodation");

        const timeSlots = {
          3: ["10:00", "12:30", "15:00", "20:00"],
          4: ["09:30", "12:00", "14:30", "18:00", "20:30"],
          5: ["09:00", "11:30", "13:30", "16:00", "18:30", "20:30"]
        }[paceCount];

        const days = [];
        let attrCursor = 0;
        let restCursor = 0;
        let cafeCursor = 0;

        for (let d = 1; d <= daysCount; d++) {
          const stops = [];
          const isLastDay = d === daysCount;

          // Morning stop
          const a1 = attractions[attrCursor % attractions.length];
          attrCursor++;
          stops.push(makeStop(a1, d, 0, timeSlots[0]));

          // Lunch
          const r1 = restaurants[restCursor % restaurants.length];
          restCursor++;
          stops.push(makeStop(r1, d, 1, timeSlots[1]));

          // Afternoon Cafe or Attraction
          if (paceCount >= 4) {
            const c1 = cafes[cafeCursor % cafes.length];
            cafeCursor++;
            stops.push(makeStop(c1, d, 2, timeSlots[2]));

            const a2 = attractions[attrCursor % attractions.length];
            attrCursor++;
            stops.push(makeStop(a2, d, 3, timeSlots[3]));
          } else {
            const c1 = cafes[cafeCursor % cafes.length];
            cafeCursor++;
            stops.push(makeStop(c1, d, 2, timeSlots[2]));
          }

          if (paceCount >= 5) {
            const r2 = restaurants[restCursor % restaurants.length];
            restCursor++;
            stops.push(makeStop(r2, d, 4, timeSlots[4]));
          }

          // Accommodation at end of non-final days
          if (!isLastDay && accoms.length > 0) {
            const ac = accoms[(d - 1) % accoms.length];
            stops.push(makeStop(ac, d, stops.length, "20:30"));
          }

          days.push({
            dayNumber: d,
            title: `${d}일차 · ${destObj.name} ${d === 1 ? "핵심 명소와 로컬 미식" : isLastDay ? "여유로운 산책과 마무리" : "감성 스팟과 야경 코스"}`,
            areaFocus: `${destObj.name} 중심 권역 및 인접 명소`,
            stops: recalcTransits(stops)
          });
        }

        // Re-inject user-added custom stops if rebalancing
        if (preservedUserStops && preservedUserStops.length > 0) {
          preservedUserStops.forEach((uStop, i) => {
            const targetDay = days[i % days.length];
            targetDay.stops.splice(Math.max(0, targetDay.stops.length - 1), 0, uStop);
            targetDay.stops = recalcTransits(targetDay.stops);
          });
        }

        calibrateBudget(days, targetBudgetWon);

        return {
          destination: destObj,
          daysCount,
          budgetKrw: budgetMan,
          routeStrategySummary: `${destObj.name} 내 지리적으로 가까운 스팟끼리 일차별로 묶어 불필요한 이동 역행을 줄이고, 선택하신 '${state.prefs.transport}' 기준 최적 동선과 ${budgetMan.toLocaleString("ko-KR")}만원 예산에 맞춰 비용을 배분했습니다.`,
          days,
          essentials: destObj.essentials
        };
      }

      function makeStop(tpl, dayNum, idx, time) {
        return {
          id: `d${dayNum}-s${idx}-${Math.random().toString(36).slice(2, 6)}`,
          time,
          durationMinutes: tpl.duration,
          name: tpl.name,
          category: tpl.category,
          description: tpl.desc,
          tip: tpl.tip,
          estimatedCostKrw: tpl.cost,
          address: tpl.addr,
          lat: tpl.lat,
          lng: tpl.lng,
          pros: tpl.pros || ["접근성이 좋고 현지 분위기가 뛰어남", "방문자 만족도가 높은 추천 스팟"],
          recItems: tpl.recItems || ["시그니처 포인트", "대표 추천 메뉴"],
          transitFromPrev: null,
          isUserAdded: false
        };
      }

      function optimizeDayRoute(stops) {
        if (stops.length <= 2) {
          return { stops, savedKm: 0 };
        }
        const beforeKm = totalDistanceKm(stops);
        const lastIsHotel = stops[stops.length - 1].category === "accommodation";
        const start = stops[0];
        const endHotel = lastIsHotel ? stops[stops.length - 1] : null;
        const middle = lastIsHotel ? stops.slice(1, -1) : stops.slice(1);

        const ordered = [start];
        const remaining = middle.slice();
        while (remaining.length > 0) {
          const cur = ordered[ordered.length - 1];
          let bestIdx = 0;
          let bestDist = Infinity;
          for (let i = 0; i < remaining.length; i++) {
            const d = haversineKm(cur.lat, cur.lng, remaining[i].lat, remaining[i].lng);
            if (d < bestDist) {
              bestDist = d;
              bestIdx = i;
            }
          }
          ordered.push(remaining.splice(bestIdx, 1)[0]);
        }
        if (endHotel) ordered.push(endHotel);

        const origTimes = stops.map((s) => s.time);
        const reTimed = ordered.map((s, idx) => Object.assign({}, s, { time: origTimes[idx] || s.time }));
        const finalStops = recalcTransits(reTimed);
        const afterKm = totalDistanceKm(finalStops);
        return { stops: finalStops, savedKm: Math.max(0, Math.round((beforeKm - afterKm) * 10) / 10) };
      }

      function naverBlogUrl(destName, placeName) {
        return "https://search.naver.com/search.naver?ssc=tab.blog.all&sm=tab_jum&query=" + encodeURIComponent(destName + " " + placeName + " 후기");
      }

      function naverMapUrl(destName, placeName) {
        return "https://map.naver.com/p/search/" + encodeURIComponent(destName + " " + placeName);
      }

      function googleRouteUrl(stops) {
        if (!stops.length) return "https://www.google.com/maps";
        if (stops.length === 1) {
          return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(stops[0].name + " " + stops[0].address);
        }
        const origin = encodeURIComponent(stops[0].lat + "," + stops[0].lng);
        const dest = encodeURIComponent(stops[stops.length - 1].lat + "," + stops[stops.length - 1].lng);
        const wps = stops.slice(1, -1).map((s) => s.lat + "," + s.lng).join("|");
        return "https://www.google.com/maps/dir/?api=1&origin=" + origin + "&destination=" + dest + (wps ? "&waypoints=" + encodeURIComponent(wps) : "");
      }

      function renderRouteSvg(day) {
        const stops = day.stops.filter((s) => Number.isFinite(s.lat) && Number.isFinite(s.lng) && (s.lat !== 0 || s.lng !== 0));
        if (!stops.length) {
          return `<div style="padding:32px;text-align:center;font-size:12px;color:#64748b;">표시할 좌표 정보가 없습니다.</div>`;
        }
        const lats = stops.map((s) => s.lat);
        const lngs = stops.map((s) => s.lng);
        const minLat = Math.min(...lats);
        const maxLat = Math.max(...lats);
        const minLng = Math.min(...lngs);
        const maxLng = Math.max(...lngs);
        const latSpan = Math.max(0.012, maxLat - minLat);
        const lngSpan = Math.max(0.012, maxLng - minLng);

        const W = 440, H = 280, px = 52, py = 44;
        const pts = stops.map((s, idx) => {
          const x = stops.length === 1 ? W / 2 : px + ((s.lng - minLng) / lngSpan) * (W - px * 2);
          const y = stops.length === 1 ? H / 2 : py + (1 - (s.lat - minLat) / latSpan) * (H - py * 2);
          return { stop: s, idx: idx + 1, x, y };
        });

        const pathD = pts.length >= 2 ? pts.map((pt, i) => (i === 0 ? "M " : "L ") + pt.x.toFixed(1) + " " + pt.y.toFixed(1)).join(" ") : "";

        return `
          <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" role="img" aria-label="${day.dayNumber}일차 이동 경로 지도">
            <defs>
              <pattern id="rgrid" width="44" height="44" patternUnits="userSpaceOnUse">
                <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#e2e8f0" stroke-width="0.7" />
              </pattern>
            </defs>
            <rect width="${W}" height="${H}" fill="url(#rgrid)" />
            ${pathD ? `<path d="${pathD}" fill="none" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="${pathD}" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" />` : ""}
            ${pts.map((pt, i) => {
              if (i === 0) return "";
              const prev = pts[i - 1];
              const mx = (prev.x + pt.x) / 2;
              const my = (prev.y + pt.y) / 2;
              const dist = pt.stop.transitFromPrev ? pt.stop.transitFromPrev.distanceKm : 0;
              if (!dist) return "";
              return `<rect x="${mx - 20}" y="${my - 9}" width="40" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" /><text x="${mx}" y="${my + 3.5}" text-anchor="middle" font-size="9" font-family="JetBrains Mono, monospace" fill="#334155">${dist.toFixed(1)}km</text>`;
            }).join("")}
            ${pts.map((pt) => {
              const sel = state.activeStopId === pt.stop.id;
              const color = (CATEGORY_META[pt.stop.category] && CATEGORY_META[pt.stop.category].color) || "#1d4ed8";
              const label = pt.stop.name.length > 9 ? pt.stop.name.slice(0, 9) + "…" : pt.stop.name;
              const ly = pt.y > 235 ? pt.y - 18 : pt.y + 23;
              return `
                <g data-pin-id="${esc(pt.stop.id)}" style="cursor:pointer;">
                  ${sel ? `<circle cx="${pt.x}" cy="${pt.y}" r="17" fill="none" stroke="#1d4ed8" stroke-width="2" opacity="0.45" />` : ""}
                  <circle cx="${pt.x}" cy="${pt.y}" r="${sel ? 13 : 11}" fill="${color}" stroke="#ffffff" stroke-width="2.5" />
                  <text x="${pt.x}" y="${pt.y + 4}" text-anchor="middle" font-size="10" font-weight="700" font-family="JetBrains Mono, monospace" fill="#ffffff">${pt.idx}</text>
                  <text x="${pt.x}" y="${ly}" text-anchor="middle" font-size="10.5" font-weight="${sel ? 700 : 500}" fill="#0f172a">${esc(label)}</text>
                </g>
              `;
            }).join("")}
          </svg>
        `;
      }

                    <ul style="margin:0;padding-left:18px;font-size:13px;color:var(--ink-secondary);">
                      ${plan.essentials.culturalAndSafetyTips.map((t) => `<li style="margin-bottom:4px;">${esc(t)}</li>`).join("")}

                  <div style="padding-top:16px;border-top:1px solid var(--bg-subtle);">
                    <h4 style="font-size:14px;font-weight:700;margin-bottom:4px;">비상 연락 및 참고사항</h4>
                    <p style="font-size:12px;color:var(--ink-muted);">${esc(plan.essentials.emergencyInfo)}</p>
                  </div>
                </div>
              </div>
            </section>
          </div>
        `;

        // Bind itinerary workspace handlers
        document.getElementById("backToRecBtn").addEventListener("click", () => {
          state.step = "recommendations";
          render();
        });

        document.getElementById("decDaysBtn").addEventListener("click", () => {
          if (state.draftDays <= 1) return;
          triggerRebalance(state.draftDays - 1, state.draftBudgetMan);
        });
        document.getElementById("incDaysBtn").addEventListener("click", () => {
          if (state.draftDays >= 10) return;
          triggerRebalance(state.draftDays + 1, state.draftBudgetMan);
        });

        const rebBudget = document.getElementById("rebalanceBudgetInput");
        rebBudget.addEventListener("input", (e) => {
          const n = Number(e.target.value);
          if (!Number.isNaN(n) && n >= 10) state.draftBudgetMan = Math.min(500, n);
          const btn = document.getElementById("applyRebalanceBtn");
          if (btn) {
            const changed = state.draftBudgetMan !== state.plan.budgetKrw;
            btn.className = changed ? "btn-cta" : "btn-secondary";
            btn.textContent = changed ? "변경된 예산으로 재구성하기" : "기간·예산 기준 일정 재구성";
          }
        });
        rebBudget.addEventListener("keydown", (e) => {
          if (e.key === "Enter") triggerRebalance(state.draftDays, state.draftBudgetMan);
        });
        document.getElementById("applyRebalanceBtn").addEventListener("click", () => {
          triggerRebalance(state.draftDays, state.draftBudgetMan);
        });

        root.querySelectorAll("[data-day-tab]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.activeDayIdx = Number(btn.getAttribute("data-day-tab"));
            state.optimizationNotice = "";
            state.activeStopId = null;
            renderItinerary();
          });
        });

        root.querySelectorAll("[data-cat-filter]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.categoryFilter = btn.getAttribute("data-cat-filter");
            renderItinerary();
          });
        });

        const resetCat = document.getElementById("resetCatBtn");
        if (resetCat) {
          resetCat.addEventListener("click", () => {
            state.categoryFilter = "all";
            renderItinerary();
          });
        }

        document.getElementById("openAddModalBtn").addEventListener("click", () => {
          state.addModalOpen = true;
          renderModal();
        });

        root.querySelectorAll("[data-stop-card]").forEach((card) => {
          card.addEventListener("click", (e) => {
            if (e.target.closest("button") || e.target.closest("a")) return;
            state.activeStopId = card.getAttribute("data-stop-card");
            renderItinerary();
          });
        });

        root.querySelectorAll("[data-pin-id], [data-route-item]").forEach((el) => {
          el.addEventListener("click", () => {
            state.activeStopId = el.getAttribute("data-pin-id") || el.getAttribute("data-route-item");
            renderItinerary();
          });
        });

        root.querySelectorAll("[data-move-up]").forEach((btn) => {
          btn.addEventListener("click", () => moveStop(Number(btn.getAttribute("data-move-up")), -1));
        });
        root.querySelectorAll("[data-move-down]").forEach((btn) => {
          btn.addEventListener("click", () => moveStop(Number(btn.getAttribute("data-move-down")), 1));
        });
        root.querySelectorAll("[data-remove-stop]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-remove-stop");
            curDay.stops = recalcTransits(curDay.stops.filter((s) => s.id !== id));
            state.optimizationNotice = "";
            renderItinerary();
          });
        });

        root.querySelectorAll("[data-open-review]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-open-review");
            state.reviewStop = curDay.stops.find((s) => s.id === id) || null;
            renderDrawer();
          });
        });

        document.getElementById("optimizeRouteBtn").addEventListener("click", () => {
          const res = optimizeDayRoute(curDay.stops);
          curDay.stops = res.stops;
          state.optimizationNotice = res.savedKm > 0.1
            ? `동선 최적화 완료: 불필요한 역행을 줄여 이동 거리를 ${res.savedKm.toFixed(1)}km 단축했습니다.`
            : "현재 일정이 이미 가장 효율적인 이동 경로로 배치되어 있습니다.";
          renderItinerary();
        });

        root.querySelectorAll("[data-check-item]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const key = btn.getAttribute("data-check-item");
            state.checkedPacking[key] = !state.checkedPacking[key];
            renderItinerary();
          });
        });
      }

      function moveStop(idx, delta) {
        const curDay = state.plan.days[state.activeDayIdx];
        const target = idx + delta;
        if (target < 0 || target >= curDay.stops.length) return;
        const arr = curDay.stops.slice();
        const item = arr.splice(idx, 1)[0];
        arr.splice(target, 0, item);
        curDay.stops = recalcTransits(arr);
        state.optimizationNotice = "";
        renderItinerary();
      }

      function triggerRebalance(newDays, newBudgetMan) {
        const clampedDays = Math.min(10, Math.max(1, newDays));
        const clampedBudget = Math.min(500, Math.max(10, newBudgetMan));
        const userStops = [];
        state.plan.days.forEach((d) => {
          d.stops.forEach((s) => { if (s.isUserAdded) userStops.push(s); });
        });
        state.plan = buildItinerary(state.plan.destination, clampedDays, clampedBudget, userStops);
        state.draftDays = clampedDays;
        state.draftBudgetMan = clampedBudget;
        if (state.activeDayIdx >= state.plan.days.length) state.activeDayIdx = 0;
        state.optimizationNotice = "";
        renderItinerary();
      }

      function renderModal() {
        const modalRoot = document.getElementById("modalRoot");
        if (!state.addModalOpen || !state.plan) {
          modalRoot.innerHTML = "";
          return;
        }
        const curDay = state.plan.days[state.activeDayIdx];
        const existingNames = state.plan.days.flatMap((d) => d.stops.map((s) => s.name));

          (p) => !existingNames.includes(p.name) && (state.addModalCategory === "all" || p.category === state.addModalCategory)
        );
        const fallbackOptions = poolOptions.length ? poolOptions : state.plan.destination.stopsPool.filter((p) => p.category === state.addModalCategory);

        modalRoot.innerHTML = `

                <div>
                  <h3 style="font-size:16px;font-weight:700;">${curDay.dayNumber}일차에 장소 추가</h3>
                  <p style="font-size:12px;color:var(--ink-muted);margin-top:2px;">원하는 장소를 직접 입력하거나 ${esc(state.plan.destination.name)} 추천 장소를 골라 추가하세요.</p>
                </div>
                <button type="button" id="closeModalBtn" class="icon-btn" aria-label="닫기">✕</button>
              </div>
              <div class="modal-body">
                <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;">
                  <div class="segmented">
                    <button type="button" class="seg-btn ${state.addModalTab === "custom" ? "active" : ""}" data-mtab="custom">직접 장소 입력</button>
                    <button type="button" class="seg-btn ${state.addModalTab === "discover" ? "active" : ""}" data-mtab="discover">주변 추천 장소</button>
                  </div>
                  <div style="display:flex;align-items:center;gap:8px;">
                    <label for="addTimeInput" style="font-size:12px;color:var(--ink-secondary);">방문 시간</label>
                    <input id="addTimeInput" type="time" class="input-time" value="15:00" style="padding:6px 10px;font-size:12px;" />
                  </div>
                </div>

                ${state.addModalTab === "custom" ? `
                  <form id="customAddForm" class="stack-lg" style="gap:12px;">
                    <div>
                      <label class="field-label" for="customPlaceName">장소명</label>
                      <input id="customPlaceName" type="text" class="input-text" style="width:100%;" placeholder="예: 추가하고 싶은 맛집, 카페, 관광지 이름" required />
                    </div>
                    <div>
                      <span class="field-label">카테고리</span>
                      <div class="chip-wrap" style="gap:6px;">
                        ${Object.keys(CATEGORY_META).map((cat) => `
                          <button type="button" class="chip-btn chip-btn-dark chip-sm ${state.addModalCategory === cat ? "active" : ""}" data-mcat="${cat}">${CATEGORY_META[cat].label}</button>
                        `).join("")}
                      </div>
                    </div>
                    <div class="grid-2" style="gap:12px;">
                      <div>
                        <label class="field-label" for="customPlaceCost">예상 비용 (원)</label>
                        <input id="customPlaceCost" type="number" min="0" step="1000" class="input-number" style="width:100%;text-align:left;" value="15000" />
                      </div>
                      <div>
                        <label class="field-label" for="customPlaceMemo">간단 메모 (선택)</label>
                        <input id="customPlaceMemo" type="text" class="input-text" style="width:100%;" placeholder="예: 예약 필수, 시그니처 메뉴" />
                      </div>
                    </div>
                    <button type="submit" class="btn-cta" style="width:100%;">일정에 추가하기</button>
                  </form>
                ` : `
                  <div class="chip-wrap" style="gap:6px;">
                    ${Object.keys(CATEGORY_META).map((cat) => `
                      <button type="button" class="chip-btn chip-btn-dark chip-sm ${state.addModalCategory === cat ? "active" : ""}" data-mcat="${cat}">${CATEGORY_META[cat].label}</button>
                    `).join("")}
                  </div>
                  <div class="stack-lg" style="gap:10px;">
                    ${fallbackOptions.map((p, i) => `
                      <div style="padding:14px;border:1px solid var(--border-hairline);border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:14px;">
                        <div style="min-width:0;">
                          <div class="meta-inline" style="margin-bottom:4px;">
                            <span style="font-weight:600;color:${CATEGORY_META[p.category].textColor};">${CATEGORY_META[p.category].label}</span>
                            <span>·</span>
                            <span class="tabular-nums">${p.duration}분</span>
                            <span>·</span>
                            <span class="tabular-nums">${formatKrw(p.cost)}</span>
                          </div>
                          <div style="font-size:14px;font-weight:700;">${esc(p.name)}</div>
                          <p style="font-size:12px;color:var(--ink-secondary);margin-top:2px;">${esc(p.desc)}</p>
                        </div>
                        <button type="button" class="btn-primary-sm" data-add-pool="${i}">+ 추가</button>
                      </div>
                    `).join("")}
                  </div>
                `}
              </div>
            </div>
          </div>
        `;

        document.getElementById("closeModalBtn").addEventListener("click", () => {
          state.addModalOpen = false;
          renderModal();
        });
        document.getElementById("modalBackdrop").addEventListener("click", (e) => {
          if (e.target.id === "modalBackdrop") {
            state.addModalOpen = false;
            renderModal();
          }
        });
        modalRoot.querySelectorAll("[data-mtab]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.addModalTab = btn.getAttribute("data-mtab");
            renderModal();
          });
        });
        modalRoot.querySelectorAll("[data-mcat]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.addModalCategory = btn.getAttribute("data-mcat");
            renderModal();
          });
        });

        const customForm = document.getElementById("customAddForm");
        if (customForm) {
          customForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const name = document.getElementById("customPlaceName").value.trim();
            if (!name) return;
            const time = document.getElementById("addTimeInput").value || "15:00";
            const cost = Number(document.getElementById("customPlaceCost").value) || 0;
            const memo = document.getElementById("customPlaceMemo").value.trim();
            const anchor = curDay.stops[0] || { lat: 37.5665, lng: 126.978 };
            const jitter = (Math.random() - 0.5) * 0.01;
            const stop = {
              id: "user-" + Date.now(),
              time,
              durationMinutes: 60,
              name,
              category: state.addModalCategory,
              description: memo || `${state.plan.destination.name} 일정에 사용자가 직접 추가한 장소입니다.`,
              tip: "방문 전 영업시간과 휴무일을 확인하세요.",
              estimatedCostKrw: cost,
              address: state.plan.destination.name,
              lat: anchor.lat + jitter,
              lng: anchor.lng + jitter,
              pros: ["사용자 맞춤 선호 장소"],
              recItems: ["현장 추천 포인트"],
              transitFromPrev: null,
              isUserAdded: true
            };
            curDay.stops = recalcTransits([...curDay.stops, stop].sort((a, b) => a.time.localeCompare(b.time)));
            state.activeStopId = stop.id;
            state.addModalOpen = false;
            render();
          });
        }

        modalRoot.querySelectorAll("[data-add-pool]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const tpl = fallbackOptions[Number(btn.getAttribute("data-add-pool"))];
            if (!tpl) return;
            const time = document.getElementById("addTimeInput").value || "15:00";
            const stop = makeStop(tpl, curDay.dayNumber, curDay.stops.length + 1, time);
            stop.isUserAdded = true;
            curDay.stops = recalcTransits([...curDay.stops, stop].sort((a, b) => a.time.localeCompare(b.time)));
            state.activeStopId = stop.id;
            state.addModalOpen = false;
            render();
          });
        });
      }

      function renderDrawer() {
        const drawerRoot = document.getElementById("drawerRoot");
        if (!state.reviewStop || !state.plan) {
          drawerRoot.innerHTML = "";
          return;
        }
        const s = state.reviewStop;
        const meta = CATEGORY_META[s.category] || CATEGORY_META.attraction;
        const blogUrl = naverBlogUrl(state.plan.destination.name, s.name);
        const mapUrl = naverMapUrl(state.plan.destination.name, s.name);

        drawerRoot.innerHTML = `
          <div class="backdrop backdrop-right" id="drawerBackdrop" role="dialog" aria-modal="true">
            <aside class="drawer-panel">
              <div class="modal-head">

                    <span>네이버 블로그 및 방문 후기 요약</span>

                <button type="button" id="closeDrawerBtn" class="icon-btn" aria-label="후기 닫기">✕</button>
              </div>

                  <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="btn-secondary" style="font-size:12px;">네이버 플레이스 ↗</a>
                </div>

                <div>
                  <h4 style="font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:6px;">방문객 후기 핵심 요약</h4>
                  <p style="font-size:14px;color:var(--ink-primary);background:var(--bg-canvas);border:1px solid var(--border-hairline);border-radius:8px;padding:14px;line-height:1.65;">
                    ${esc(s.description)}
                  </p>
                </div>

                <div>
                  <h4 style="font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;">자주 언급되는 장점</h4>
                  <div class="stack-lg" style="gap:8px;">
                    ${(s.pros || []).map((pro, i) => `
                      <div style="display:flex;gap:10px;font-size:13px;color:var(--ink-secondary);">
                        <span class="tabular-nums" style="color:var(--accent-blue);font-weight:600;">0${i + 1}</span>
                        <span>${esc(pro)}</span>
                      </div>
                    `).join("")}
                  </div>
                </div>

                <div>
                  <h4 style="font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;">추천 메뉴 및 포토 스팟</h4>
                  <ul style="margin:0;padding-left:18px;font-size:13px;color:var(--ink-secondary);">
                    ${(s.recItems || []).map((item) => `<li style="margin-bottom:4px;">${esc(item)}</li>`).join("")}
                  </ul>
                </div>

                <div>
                  <h4 style="font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;">웨이팅 · 방문 팁</h4>
                  <div style="font-size:13px;color:#78350f;background:var(--accent-amber-soft);border:1px solid #fde68a;border-radius:8px;padding:14px;">
                    ! ${esc(s.tip || "방문 전 영업시간과 휴무일을 확인하는 것을 권장합니다.")}
                  </div>
                </div>
              </div>
            </aside>
          </div>
        `;

        document.getElementById("closeDrawerBtn").addEventListener("click", () => {
          state.reviewStop = null;
          renderDrawer();
        });
        document.getElementById("drawerBackdrop").addEventListener("click", (e) => {
          if (e.target.id === "drawerBackdrop") {
            state.reviewStop = null;
            renderDrawer();
          }
        });
      }

      // Global Topbar & Keyboard Events
      document.getElementById("brandBtn").addEventListener("click", () => {
        state.step = "preferences";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      document.getElementById("resetTopBtn").addEventListener("click", () => {
        state.step = "preferences";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      document.querySelectorAll("[data-nav]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const target = btn.getAttribute("data-nav");
          if (target === "essentials") {
            if (!state.plan) return;
            state.step = "itinerary";
            render();
            const el = document.getElementById("travelEssentials");
            if (el) el.scrollIntoView({ behavior: "smooth" });
            return;
          }
          if (target === "recommendations" && !state.recommendations.length) return;
          if (target === "itinerary" && !state.plan) return;
          state.step = target;
          render();
        });
      });

      document.querySelectorAll("[data-step]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const target = btn.getAttribute("data-step");
          if (target === "recommendations" && !state.recommendations.length) return;
          if (target === "itinerary" && !state.plan) return;
          state.step = target;
          render();
        });
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          let changed = false;
          if (state.reviewStop) { state.reviewStop = null; changed = true; }
          if (state.addModalOpen) { state.addModalOpen = false; changed = true; }
          if (changed) { renderModal(); renderDrawer(); }
        }
      });

      const downloadBtn = document.getElementById("downloadHtmlBtn");
      if (downloadBtn) {
        downloadBtn.addEventListener("click", () => {
          const htmlContent = PRISTINE_HTML_SNAPSHOT || ("<!doctype html>\n" + document.documentElement.outerHTML);
          const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "index.html";
          a.style.display = "none";
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, 1500);
          const originalLabel = "index.html 다운로드";
          downloadBtn.textContent = "다운로드 완료 ✓";
          setTimeout(() => {
            downloadBtn.textContent = originalLabel;
          }, 2000);
        });
      }

      render();
    })();
  </script></body></html>
